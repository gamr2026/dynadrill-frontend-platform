<main class="login-page">
  <div class="login-page__card">
    <div class="login-page__brand" aria-hidden="true">
      <img class="login-page__brand-logo" ngSrc="/brand/dynadrill-logo-white.svg" width="213" height="120" alt="" priority />
    </div>

    <form class="login-page__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="login-page__header">
        <img class="login-page__logo" ngSrc="/brand/dynadrill-logo.svg" width="99" height="56" alt="Dynadrill" priority />
        <dynadrill-text variant="h1">Elija su contraseña</dynadrill-text>
        <dynadrill-text variant="subtitle">
          Su cuenta tiene una clave provisional. Escriba una propia para continuar.
        </dynadrill-text>
      </div>

      @if (errorMessage(); as message) {
        <div class="login-page__banner" role="alert">
          <dynadrill-banner variant="critical" [message]="message" />
        </div>
      }

      <dynadrill-input
        class="login-page__field"
        [class.login-page__field--error]="currentInvalid()"
        label="Clave actual (provisional)"
        type="password"
        placeholder="••••••••"
        [disabled]="submitting()"
        [value]="form.controls.currentPassword.value"
        (valueChange)="form.controls.currentPassword.setValue($event)"
      />

      <dynadrill-input
        class="login-page__field"
        [label]="'Clave nueva (mínimo ' + minLength + ' caracteres)'"
        type="password"
        placeholder="••••••••••"
        [disabled]="submitting()"
        [value]="form.controls.newPassword.value"
        (valueChange)="form.controls.newPassword.setValue($event)"
      />

      <dynadrill-input
        class="login-page__field"
        label="Repita la clave nueva"
        type="password"
        placeholder="••••••••••"
        [disabled]="submitting()"
        [value]="form.controls.confirm.value"
        (valueChange)="form.controls.confirm.setValue($event)"
      />

      <dynadrill-button class="login-page__submit" size="large" [disabled]="submitting()">
        {{ submitting() ? 'Guardando…' : 'Guardar y continuar' }}
      </dynadrill-button>

      <button type="button" class="login-page__forgot-link" (click)="cancel()">Salir sin cambiar</button>
    </form>
  </div>
</main>
