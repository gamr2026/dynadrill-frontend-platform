<div class="excepcion-dialog">
  <dynadrill-input label="Monto excedente estimado" type="number" [value]="montoExcedente()" (valueChange)="montoExcedente.set($any($event))" />
  <dynadrill-textarea label="Justificación técnica" placeholder="¿Qué causó el excedente?" [value]="justificacion()" (valueChange)="justificacion.set($event)" [rows]="3" />

  <div class="excepcion-dialog__actions">
    <dynadrill-button variant="secondary" (clicked)="cancelar()">Cancelar</dynadrill-button>
    <dynadrill-button [disabled]="!puedeGuardar() || submitting()" (clicked)="guardar()">
      {{ submitting() ? 'Registrando…' : 'Registrar excepción' }}
    </dynadrill-button>
  </div>
</div>
