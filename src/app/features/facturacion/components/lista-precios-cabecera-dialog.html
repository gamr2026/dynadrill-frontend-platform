<div class="lp-cab">
  <div class="lp-cab__grid">
    <dynadrill-select
      label="Cliente"
      placeholder="Selecciona del catálogo"
      [searchable]="true"
      [options]="clienteOptions()"
      [value]="cliente()"
      (valueChange)="cliente.set($any($event ?? ''))"
    />
    <dynadrill-input label="Nº de contrato" [value]="numeroContrato()" (valueChange)="numeroContrato.set($event)" />
    <dynadrill-datetime-picker mode="date" label="Vigente desde" [value]="vigenteDesde()!" (valueChange)="vigenteDesde.set($event)" />
    <dynadrill-select
      label="Estado"
      [options]="activaOptions"
      [value]="activa() ? 'si' : 'no'"
      (valueChange)="activa.set($any($event) === 'si')"
    />
  </div>
  <dynadrill-text variant="caption">Los ítems se cargan por el import real de datos, no desde acá.</dynadrill-text>

  <div class="lp-cab__actions">
    <dynadrill-button variant="secondary" (clicked)="cancelar()">Cancelar</dynadrill-button>
    <dynadrill-button [disabled]="!puedeGuardar() || submitting()" (clicked)="guardar()">
      {{ submitting() ? 'Guardando…' : 'Crear lista' }}
    </dynadrill-button>
  </div>
</div>
