<div class="lista-precios-page">
  <dynadrill-screen-header
    eyebrow="FACTURACIÓN"
    title="Listas de precios"
    subtitle="Tarifario por cliente / contrato. Los códigos provienen de AS2."
  />

  <div class="lista-precios-page__toolbar">
    <button type="button" class="lista-precios-page__new" (click)="nuevaLista()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" /></svg>Nueva lista</button>
  </div>

  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando…">
    <div class="kpi-stat-row" role="list">
      @for (kpi of kpis(); track kpi.label) {
        <app-kpi-stat [value]="kpi.value" [label]="kpi.label" [caption]="kpi.caption" [tone]="kpi.tone" />
      }
    </div>

    @if (listas().length) {
      <div class="lista-precios-page__grid">
        @for (l of listas(); track l.id) {
          <button type="button" class="lista-precios-page__card" [attr.aria-label]="'Abrir lista de ' + l.cliente" (click)="abrir(l.id)">
            <div class="lista-precios-page__card-head">
              <strong>{{ l.cliente }}</strong>
              <dynadrill-tag [label]="l.activa ? 'Activa' : 'Inactiva'" [variant]="l.activa ? 'success' : 'neutral'" />
            </div>
            <p class="lista-precios-page__card-meta">Contrato {{ l.numeroContrato }} · vigente desde {{ l.vigenteDesde }}</p>
            <div class="lista-precios-page__card-foot">
              <strong>{{ l.items.length }} ítems</strong>
              <span class="lista-precios-page__card-tipos">
                <dynadrill-tag [label]="contarPorTipo(l, 'Servicio') + ' Servicio'" variant="brand" />
                <dynadrill-tag [label]="contarPorTipo(l, 'Material') + ' Material'" variant="neutral" />
              </span>
              <span class="lista-precios-page__chev" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6" /></svg></span>
            </div>
          </button>
        }
      </div>
    } @else {
      <section class="fact-card"><dynadrill-text variant="body">Todavía no hay listas de precios. Crea la primera.</dynadrill-text></section>
    }
  </dynadrill-spinner>
</div>
