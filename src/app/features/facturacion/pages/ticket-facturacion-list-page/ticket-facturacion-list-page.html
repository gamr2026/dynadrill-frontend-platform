<div class="ticket-facturacion-list-page">
  <dynadrill-screen-header eyebrow="FACTURACIÓN" title="Tickets" subtitle="FACT-004 — cierres generados, pendientes de facturar en AS2" />

  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando…">
    <dynadrill-kpi-row [items]="kpis()" />

    <ng-template #actionsTpl let-row>
      <dynadrill-button variant="secondary" size="small" (clicked)="verDetalle(row)">Ver detalle</dynadrill-button>
    </ng-template>

    <section class="fact-card">
      <div class="table-scroll">
        <dynadrill-data-table [columns]="columns" [rows]="rows()" [rowKey]="rowKeyFn" [pageSize]="10" [actionsTemplate]="actionsTpl" />
      </div>
    </section>
  </dynadrill-spinner>
</div>
