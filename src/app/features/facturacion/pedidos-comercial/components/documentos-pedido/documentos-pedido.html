<div class="docs">
  @if (errorSubida(); as e) {
    <dynadrill-banner variant="critical" [message]="e" />
  }

  <ul class="docs__lista">
    @for (d of documentos(); track d.id) {
      <li class="docs__item">
        <div class="docs__datos">
          <strong>{{ d.nombre }}</strong>
          <span class="docs__meta">{{ tamano(d.tamanoBytes) }} · {{ dia(d.createdAt) }} · {{ d.subidoPor ?? 'Sin dato' }}</span>
        </div>
        <div class="docs__acciones">
          <dynadrill-icon-button icon="file-text" [tooltip]="'Descargar ' + d.nombre" [disabled]="descargando() !== null" (clicked)="descargar(d)" />
          @if (puedeEditar()) {
            <dynadrill-icon-button icon="delete" [tooltip]="'Quitar ' + d.nombre" (clicked)="quitar(d)" />
          }
        </div>
      </li>
    } @empty {
      <li class="docs__vacio">El pedido no tiene documentos adjuntos.</li>
    }
  </ul>

  @if (puedeEditar()) {
    <label class="docs__subir">
      <span>{{ subiendo() ? 'Subiendo el documento…' : 'Adjuntar documento (PDF, PNG, JPEG, DOCX o XLSX; máximo 25 MB; hasta ' + maximo + ' por pedido)' }}</span>
      <input type="file" [accept]="accept" [disabled]="subiendo()" (change)="onArchivo($event)" />
    </label>
  }
</div>
