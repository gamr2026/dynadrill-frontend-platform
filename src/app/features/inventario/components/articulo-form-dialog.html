<div class="articulo-form-dialog">
  <div class="articulo-form-dialog__row">
    <dynadrill-input
      label="Código (AS2)"
      placeholder="Ej. 0256822"
      [value]="codigo()"
      [disabled]="isEditMode"
      (valueChange)="codigo.set($event)"
    />
    <dynadrill-input label="Código alterno" [value]="codigoAlterno()" (valueChange)="codigoAlterno.set($event)" />
  </div>

  <div class="articulo-form-dialog__row">
    <dynadrill-input label="Código comercial" [value]="codigoComercial()" (valueChange)="codigoComercial.set($event)" />
    <dynadrill-input label="Código de barras" [value]="codigoBarras()" (valueChange)="codigoBarras.set($event)" />
  </div>

  <dynadrill-input label="Nombre" placeholder="Nombre del artículo" [value]="nombre()" (valueChange)="nombre.set($event)" />
  <dynadrill-input label="Nombre comercial" [value]="nombreComercial()" (valueChange)="nombreComercial.set($event)" />

  <div class="articulo-form-dialog__row">
    <dynadrill-select
      label="Categoría"
      placeholder="Seleccione la categoría"
      [options]="categoriaOptions()"
      [value]="categoriaId()"
      [searchable]="true"
      (valueChange)="onCategoria($event)"
    />
    <dynadrill-select
      label="Subcategoría"
      placeholder="Sin subcategoría"
      [options]="subcategoriaOptions()"
      [value]="subcategoriaId()"
      [disabled]="!categoriaId()"
      [searchable]="true"
      (valueChange)="onSubcategoria($event)"
    />
  </div>

  <div class="articulo-form-dialog__row">
    <dynadrill-select
      label="Unidad de stock"
      placeholder="Seleccione la unidad"
      [options]="unidadOptions()"
      [value]="unidadStockId()"
      (valueChange)="onUnidad($event)"
    />
    <dynadrill-input
      label="Costo unitario (USD, interno)"
      type="number"
      [value]="costoUnitario()"
      (valueChange)="costoUnitario.set($event)"
    />
    <dynadrill-input
      label="Descuento sugerido (%)"
      type="number"
      [value]="descuentoSugerido()"
      (valueChange)="descuentoSugerido.set($event)"
    />
  </div>

  <dynadrill-textarea label="Nota" [value]="nota()" (valueChange)="nota.set($event)" [rows]="2" />
  <dynadrill-textarea label="Información adicional" [value]="informacionAdicional()" (valueChange)="informacionAdicional.set($event)" [rows]="2" />

  <dynadrill-checkbox label="Activo" [checked]="activo()" (checkedChange)="activo.set($event)" />

  <div class="articulo-form-dialog__row">
    <dynadrill-checkbox
      label="Se entrega a una persona (EPI o ropa de trabajo)"
      [checked]="entregaPersonal()"
      (checkedChange)="onEntregaPersonal($event)"
    />
    @if (entregaPersonal()) {
      <dynadrill-select
        label="Tipo de talla"
        placeholder="No lleva talla"
        [options]="tallaOptions"
        [value]="tipoTalla()"
        (valueChange)="onTipoTalla($event)"
      />
    }
  </div>

  <div class="articulo-form-dialog__actions">
    <dynadrill-button variant="secondary" (clicked)="cancel()">Cancelar</dynadrill-button>
    <dynadrill-button [disabled]="!canSave() || submitting()" (clicked)="save()">
      {{ submitting() ? 'Guardando…' : isEditMode ? 'Guardar cambios' : 'Crear artículo' }}
    </dynadrill-button>
  </div>
</div>
