<dynadrill-screen-header
  eyebrow="Inventario"
  title="Despachos a Facturación"
  subtitle="Solicitudes de despacho de materiales/herramientas que pide Facturación (correlación con Orden Salida Material de AS2)"
/>

<div class="despachos-bodega-page__toolbar">
  <dynadrill-select
    class="despachos-bodega-page__filter"
    placeholder="Estado"
    [options]="estadoOptions"
    [value]="filtroEstado() ?? ''"
    (valueChange)="filtroEstado.set($any($event) || null)"
  />
</div>

<dynadrill-kpi-row [items]="kpis()" />

<ng-template #actionsTpl let-row>
  <dynadrill-icon-button icon="eye" tooltip="Ver / gestionar" (clicked)="gestionar(row)" />
</ng-template>

<dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando despachos…">
  <dynadrill-data-table
    [columns]="columns"
    [rows]="rows()"
    [rowKey]="rowKeyFn"
    [pageSize]="12"
    [actionsTemplate]="actionsTpl"
  />
</dynadrill-spinner>
