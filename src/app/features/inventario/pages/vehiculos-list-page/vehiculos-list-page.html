<dynadrill-screen-header
  eyebrow="Inventario"
  title="Vehículos y Maquinaria"
  subtitle="Mismo registro que Mantenimiento — datos patrimoniales (placa, marca, responsable)"
/>

<div class="vehiculos-list-page__toolbar">
  <dynadrill-button (clicked)="nuevaUnidad()">+ Nueva unidad</dynadrill-button>
</div>

<ng-template #actionsTpl let-row>
  <div class="dyn-actions-row">
    <dynadrill-button variant="secondary" size="small" (clicked)="verHistorial(row)">Ver historial</dynadrill-button>
    <dynadrill-button variant="secondary" size="small" (clicked)="editar(row)">Editar</dynadrill-button>
  </div>
</ng-template>

<dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando vehículos…">
  <dynadrill-data-table
    [columns]="columns"
    [rows]="rows()"
    [rowKey]="rowKeyFn"
    [pageSize]="10"
    [actionsTemplate]="actionsTpl"
  />
</dynadrill-spinner>
