<div class="suborder-review-dialog">
  <div class="suborder-review-dialog__row">
    <dynadrill-text variant="caption">Sub-orden</dynadrill-text>
    <dynadrill-text variant="body">{{ data.subOrder.code }} · Tipo: {{ data.subOrder.type }}</dynadrill-text>
  </div>

  <app-novedad-readonly label="Novedad reportada por el operador (Reporte de Unidad)" [content]="data.novedadOriginal" />

  <div class="suborder-review-dialog__row">
    <dynadrill-text variant="caption">Diagnóstico técnico (enviado por el técnico asignado)</dynadrill-text>
    <dynadrill-text variant="body">{{ data.subOrder.diagnostico }}</dynadrill-text>
  </div>

  <div class="suborder-review-dialog__row">
    <dynadrill-text variant="caption">Actividades correctivas (enviado por el técnico asignado)</dynadrill-text>
    <dynadrill-text variant="body">{{ data.subOrder.actividadesCorrectivas }}</dynadrill-text>
  </div>

  <dynadrill-approval-actions
    [decision]="decision()"
    consequenceApprove="Sub-orden cerrada. Si era la última pendiente, la orden padre queda Aceptada."
    consequenceReject="Se solicitan correcciones — vuelve al operador asignado."
    (decisionChange)="decide($event)"
  />
</div>
