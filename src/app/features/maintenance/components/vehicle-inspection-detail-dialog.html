<div class="vehicle-inspection-detail-dialog">
  <dynadrill-context-card [items]="generalItems()" layout="vertical" />

  @if (documentosItems().length > 0) {
    <section class="vehicle-inspection-detail-dialog__section">
      <h3 class="vehicle-inspection-detail-dialog__title">Documentos del vehículo</h3>
      <dynadrill-context-card [items]="documentosItems()" layout="vertical" />
    </section>
  }

  <section class="vehicle-inspection-detail-dialog__section">
    <h3 class="vehicle-inspection-detail-dialog__title">Checklist — Vehículo</h3>
    <dynadrill-data-table [columns]="checklistColumns" [rows]="vehiculoRows()" [pageSize]="0" />
  </section>

  <section class="vehicle-inspection-detail-dialog__section">
    <h3 class="vehicle-inspection-detail-dialog__title">Checklist — Equipo</h3>
    <dynadrill-data-table [columns]="checklistColumns" [rows]="equipoRows()" [pageSize]="0" />
  </section>

  <section class="vehicle-inspection-detail-dialog__section">
    <h3 class="vehicle-inspection-detail-dialog__title">Documentos del conductor</h3>
    <dynadrill-context-card [items]="conductorItems()" layout="vertical" />
    @if (insp.observacionesConductor) {
      <p class="vehicle-inspection-detail-dialog__observaciones">{{ insp.observacionesConductor }}</p>
    }
  </section>

  <section class="vehicle-inspection-detail-dialog__section">
    <h3 class="vehicle-inspection-detail-dialog__title">Aprobación</h3>
    <dynadrill-context-card [items]="aprobacionItems()" layout="vertical" />
  </section>
</div>
