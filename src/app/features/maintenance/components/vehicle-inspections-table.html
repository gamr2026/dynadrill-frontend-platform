@if (editable() || approvable()) {
  <dynadrill-data-table [columns]="columns()" [rows]="rows()" [rowKey]="rowKeyFn" [pageSize]="10" [actionsTemplate]="actionsTpl" />
} @else {
  <dynadrill-data-table [columns]="columns()" [rows]="rows()" [rowKey]="rowKeyFn" [pageSize]="10" />
}

<ng-template #actionsTpl let-row>
  @if (row['canEdit']) {
    <dynadrill-button variant="secondary" size="small" (clicked)="onEdit(row)">Editar inspección</dynadrill-button>
  }
  @if (row['canApprove']) {
    <dynadrill-button size="small" (clicked)="onApprove(row)">Aprobar inspección</dynadrill-button>
  }
</ng-template>
