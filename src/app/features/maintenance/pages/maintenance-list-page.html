<div class="maintenance-list-page">
  <dynadrill-screen-header
    title="Mantenimiento"
    subtitle="Dashboard de órdenes correctivas y preventivas"
    [roleTag]="roleName()"
  />

  <dynadrill-kpi-row [items]="kpis()" />

  <dynadrill-tabs
    [tabs]="tabs"
    [activeIndex]="activeTab()"
    (activeIndexChange)="onTabChange($event)"
  />

  <!-- ── TAB CORRECTIVO — hidden en lugar de @if para no destruir/recrear ── -->
  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando órdenes…">
  <div [hidden]="activeTab() !== 0">
    <dynadrill-data-table
      [columns]="columns()"
      [rows]="rows()"
      [rowKey]="rowKeyFn"
      [pageSize]="10"
      [actionsTemplate]="actionsTpl"
      [actionsFixed]="!!tableScrollX()"
      [scrollX]="tableScrollX() ?? ''"
    />

    <ng-template #actionsTpl let-row>
      <dynadrill-icon-button icon="eye" tooltip="Ver detalle" tooltipPlacement="top" (clicked)="viewDetail(row)" />
      @if (row['kind'] === 'order' && row['statusBadge']?.['text'] === 'Cerrado') {
        <dynadrill-icon-button icon="file-pdf" tooltip="Ver informe DYN-MNT-RE-008" tooltipPlacement="top" (clicked)="openReport(row)" />
      }
    </ng-template>
  </div>

  <!-- ── TAB PREVENTIVO — hidden en lugar de @if para no destruir/recrear ── -->
  <div [hidden]="activeTab() !== 1" class="prev-section">

    <!-- Statistics — clic filtra la tabla -->
    <div class="prev-stats">
      <div class="prev-stats__card prev-stats__card--rojo" [class.prev-stats__card--active]="filtroNivel() === 'rojo'" (click)="toggleFiltroNivel('rojo')">
        <dynadrill-statistic [value]="resumenPreventivo().rojo" title="Vencidos" tone="error" />
      </div>
      <div class="prev-stats__card prev-stats__card--amarillo" [class.prev-stats__card--active]="filtroNivel() === 'amarillo'" (click)="toggleFiltroNivel('amarillo')">
        <dynadrill-statistic [value]="resumenPreventivo().amarillo" title="Próximos" tone="warning" />
      </div>
      <div class="prev-stats__card prev-stats__card--verde" [class.prev-stats__card--active]="filtroNivel() === 'verde'" (click)="toggleFiltroNivel('verde')">
        <dynadrill-statistic [value]="resumenPreventivo().verde" title="Al día" tone="success" />
      </div>
    </div>

    <!-- Toolbar de filtros -->
    <div class="prev-toolbar">
      <dynadrill-select
        class="prev-toolbar__select"
        placeholder="Tipo de unidad"
        [options]="tipoOptions"
        [value]="filtroTipo()"
        (valueChange)="filtroTipo.set($any($event)); prevPage.set(1)"
      />
      @if (filtroNivel() || filtroTipo()) {
        <dynadrill-button variant="secondary" size="small" (clicked)="filtroNivel.set(null); filtroTipo.set(null); prevPage.set(1)">
          Limpiar filtros
        </dynadrill-button>
      }
      <span class="prev-toolbar__count">{{ alertasFiltradas().length }} registros</span>
    </div>

    <!-- Tabla preventivo con columnas fijas -->
    <dynadrill-data-table
      [columns]="prevColumns"
      [rows]="prevRows()"
      [rowKey]="prevRowKeyFn"
      [pageSize]="10"
      scrollX="780px"
      [actionsTemplate]="prevActionsTpl"
      [actionsFixed]="true"
    />

    <ng-template #prevActionsTpl let-row>
      <dynadrill-icon-button
        icon="check-circle"
        tooltip="Registrar mantenimiento"
        tooltipPlacement="top"
        (clicked)="openRegisterPM(row)"
      />
      <dynadrill-icon-button
        icon="clock"
        iconSource="dynadrill"
        tooltip="Ver historial"
        tooltipPlacement="top"
        (clicked)="openHistorial(row)"
      />
    </ng-template>
  </div>
  </dynadrill-spinner>
</div>
