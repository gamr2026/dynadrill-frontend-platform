<div class="maintenance-list-page">
  <dynadrill-screen-header
    title="Mantenimiento"
    subtitle="Dashboard de órdenes correctivas y preventivas"
    [roleTag]="roleName()"
  />

  <dynadrill-kpi-row [items]="kpis()" />

  <dynadrill-tabs
    [tabs]="tabs"
    [activeIndex]="activeTab()"
    (activeIndexChange)="onTabChange($event)"
  />

  <!-- ── TAB CORRECTIVO — hidden en lugar de @if para no destruir/recrear ── -->
  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando órdenes…">
  <div [hidden]="activeTab() !== 0">
    <div class="table-scroll">
      <dynadrill-data-table
        [columns]="columns()"
        [rows]="rows()"
        [rowKey]="rowKeyFn"
        [pageSize]="10"
        [actionsTemplate]="actionsTpl"
      />
    </div>

    <ng-template #actionsTpl let-row>
      <div class="dyn-actions-row">
        <dynadrill-icon-button icon="eye" tooltip="Ver detalle" (clicked)="viewDetail(row)" />
        @if (row['kind'] === 'order') {
          @if (tieneSubOrden(row, false)) {
            <dynadrill-icon-button icon="file-text" tooltip="Orden de trabajo (PDF)" (clicked)="openOrdenGeneral(row)" />
          }
          @if (tieneSubOrden(row, true)) {
            <dynadrill-icon-button icon="tool" tooltip="Orden operativa (PDF)" (clicked)="openOrdenOperativa(row)" />
          }
          @if (row['statusBadge']?.['text'] === 'Cerrado') {
            <dynadrill-icon-button icon="file-pdf" tooltip="Ver informe" (clicked)="openReport(row)" />
          }
        }
      </div>
    </ng-template>
  </div>

  <!-- ── TAB PREVENTIVO — hidden en lugar de @if para no destruir/recrear ── -->
  <div [hidden]="activeTab() !== 1" class="prev-section">

    <!-- Statistics — clic filtra la tabla -->
    <div class="prev-stats">
      <div class="prev-stats__card prev-stats__card--rojo" [class.prev-stats__card--active]="filtroNivel() === 'rojo'" (click)="toggleFiltroNivel('rojo')">
        <dynadrill-statistic [value]="resumenPreventivo().rojo" title="Vencidos" tone="error" />
      </div>
      <div class="prev-stats__card prev-stats__card--amarillo" [class.prev-stats__card--active]="filtroNivel() === 'amarillo'" (click)="toggleFiltroNivel('amarillo')">
        <dynadrill-statistic [value]="resumenPreventivo().amarillo" title="Próximos" tone="warning" />
      </div>
      <div class="prev-stats__card prev-stats__card--verde" [class.prev-stats__card--active]="filtroNivel() === 'verde'" (click)="toggleFiltroNivel('verde')">
        <dynadrill-statistic [value]="resumenPreventivo().verde" title="Al día" tone="success" />
      </div>
    </div>

    <!-- Toolbar de filtros -->
    <div class="prev-toolbar">
      <dynadrill-select
        class="prev-toolbar__select"
        placeholder="Tipo de unidad"
        [options]="tipoOptions"
        [value]="filtroTipo()"
        (valueChange)="filtroTipo.set($any($event)); prevPage.set(1)"
      />
      @if (filtroNivel() || filtroTipo()) {
        <dynadrill-button variant="secondary" size="small" (clicked)="filtroNivel.set(null); filtroTipo.set(null); prevPage.set(1)">
          Limpiar filtros
        </dynadrill-button>
      }
      <span class="prev-toolbar__count">{{ alertasFiltradas().length }} registros</span>
    </div>

    <!--
      Sin scrollX: nzScroll.x hace que nz-table mida el ancho "natural" de
      cada columna con un renglón oculto (ant-table-measure-now) y lo fije
      en px vía colgroup — esa medición no esperaba a que dynadrill-button
      terminara de renderizar dentro del actionsTemplate, midió esa columna
      en ~15px y la dejó fija así aunque el contenido real fuera mucho más
      ancho (de ahí el texto montado/el encabezado partido letra por letra).
      Sin scrollX, table-layout vuelve a "auto": cada columna se dimensiona
      según su contenido real, sin medición previa que se pueda desincronizar.
    -->
    <div class="table-scroll">
      <dynadrill-data-table
        [columns]="prevColumns"
        [rows]="prevRows()"
        [rowKey]="prevRowKeyFn"
        [pageSize]="10"
        [actionsTemplate]="prevActionsTpl"
      />
    </div>

    <ng-template #prevActionsTpl let-row>
      <div class="dyn-actions-row">
        <dynadrill-button size="small" (clicked)="openRegisterPM(row)">Registrar mantenimiento</dynadrill-button>
        <dynadrill-button variant="secondary" size="small" (clicked)="openHistorial(row)">Ver historial</dynadrill-button>
      </div>
    </ng-template>
  </div>

  <!-- ── TAB INSPECCIONES — solo lectura, visibilidad total (con y sin novedad) ── -->
  <div [hidden]="activeTab() !== 2">
    <app-vehicle-inspections-table
      [inspections]="inspections()"
      [orders]="orders()"
      [unitReports]="unitReports()"
      [editable]="false"
      (view)="viewInspection($event)"
    />
  </div>
  </dynadrill-spinner>
</div>
