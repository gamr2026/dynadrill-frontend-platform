<div class="maintenance-list-page">
  <dynadrill-screen-header
    title="Mantenimiento"
    subtitle="Dashboard de órdenes correctivas"
    [roleTag]="roleName()"
  />

  <dynadrill-kpi-row [items]="kpis()" />

  <dynadrill-data-table
    [columns]="columns()"
    [rows]="rows()"
    [loading]="loading()"
    [rowKey]="rowKeyFn"
    [actionsTemplate]="actionsTpl"
    [actionsFixed]="!!tableScrollX()"
    [scrollX]="tableScrollX() ?? ''"
  />

  <ng-template #actionsTpl let-row>
    <button type="button" class="dynadrill-data-table__action-btn" title="Ver detalle" (click)="viewDetail(row)">
      <dynadrill-icon name="search" [size]="14" />
    </button>
  </ng-template>
</div>
