<div class="my-tasks-page">
  <dynadrill-screen-header
    title="Mantenimiento"
    subtitle="Sub-órdenes asignadas — diagnóstico y ejecución"
    [roleTag]="roleName()"
  />

  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando tareas…">
    <dynadrill-data-table
      [columns]="columns()"
      [rows]="rows()"
      [rowKey]="rowKeyFn"
      [actionsTemplate]="actionsTpl"
      [actionsFixed]="!!tableScrollX()"
      [scrollX]="tableScrollX() ?? ''"
    />
  </dynadrill-spinner>

  <ng-template #actionsTpl let-row>
    <dynadrill-icon-button icon="eye" tooltip="Ver detalle" tooltipPlacement="top" (clicked)="viewDetail(row)" />
    @if (isActionable(row)) {
      <dynadrill-icon-button icon="edit" tooltip="Diagnosticar / Ejecutar" tooltipPlacement="top" (clicked)="openExecution(row)" />
    }
  </ng-template>
</div>
