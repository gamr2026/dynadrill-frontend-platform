<div class="operator-maintenance-page">
  <dynadrill-screen-header
    title="Mantenimiento Operativo"
    subtitle="Sub-órdenes operativas derivadas a su equipo — diagnóstico y ejecución"
    [roleTag]="roleName()"
  />

  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando mantenimientos…">
    <dynadrill-data-table
      [columns]="columns()"
      [rows]="rows()"
      [rowKey]="rowKeyFn"
      [actionsTemplate]="actionsTpl"
      actionsHeader="Acciones"
    />
  </dynadrill-spinner>

  <ng-template #actionsTpl let-row>
    <dynadrill-icon-button icon="eye" tooltip="Ver detalle" tooltipPlacement="top" (clicked)="viewDetail(row)" />
    @if (isActionable(row)) {
      <dynadrill-icon-button icon="edit" tooltip="Diagnosticar / Ejecutar" tooltipPlacement="top" (clicked)="openExecution(row)" />
    }
  </ng-template>
</div>
