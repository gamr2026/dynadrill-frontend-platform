<div class="vehicle-inspection-page">
  <dynadrill-screen-header
    title="Mantenimiento"
    subtitle="Inspección de Vehículos — DYN-SGI-RE-068"
    [roleTag]="roleName()"
  />

  @if (isConductor()) {
    <div class="vehicle-inspection-page__toolbar">
      <dynadrill-button (clicked)="openInspection()">
        <dynadrill-icon name="add" [size]="14" />
        Nueva inspección
      </dynadrill-button>
    </div>
  }

  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando inspecciones…">
    <app-vehicle-inspections-table
      [inspections]="inspections()"
      [orders]="orders()"
      [unitReports]="unitReports()"
      [editable]="isConductor()"
      [approvable]="isSupervisor()"
      (edit)="editInspection($event)"
      (approve)="approveInspection($event)"
    />
  </dynadrill-spinner>
</div>
