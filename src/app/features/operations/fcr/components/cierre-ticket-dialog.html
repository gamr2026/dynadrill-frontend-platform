<section class="fcr-dialog">
  <dynadrill-text variant="h1">Cerrar ticket FCR</dynadrill-text>

  <div class="fcr-dialog__summary">
    @for (item of summaryItems; track item.label) {
      <div class="fcr-dialog__summary-row">
        <dynadrill-text variant="caption">{{ item.label }}</dynadrill-text>
        <dynadrill-text variant="body">{{ item.value }}</dynadrill-text>
      </div>
    }
  </div>

  <dynadrill-banner
    variant="info"
    message="Al cerrar el ticket se enviará automáticamente la encuesta de satisfacción al cliente."
  />
</section>

<footer class="fcr-dialog__actions">
  <dynadrill-button variant="secondary" (clicked)="cancel()">Cancelar</dynadrill-button>
  <dynadrill-button variant="success" (clicked)="close()">Cerrar ticket</dynadrill-button>
</footer>
