<dynadrill-screen-header
  eyebrow="PUM-01"
  title="Tickets Pumping"
  subtitle="Dashboard de propuestas y tickets activos"
  roleTag="Jefe de Base"
/>

<dynadrill-kpi-row [items]="kpis()" />

<dynadrill-tabs
  [tabs]="tabs()"
  [activeIndex]="activeTabIndex()"
  (activeIndexChange)="onTabChange($event)"
/>

<!-- Template de acciones reutilizable -->
<ng-template #actionsTpl let-row>
  <dynadrill-button variant="secondary" size="small" (click)="viewDetail(row)">
    Ver detalle
  </dynadrill-button>
</ng-template>

@if (isInProcessTab()) {
  <dynadrill-data-table
    [columns]="inProcessColumns"
    [rows]="inProcessRows()"
    [loading]="loading()"
    [rowKey]="rowKeyFn"
    [pageSize]="10"
    actionsHeader="Acciones"
    [actionsTemplate]="actionsTpl"
  />
} @else {
  <dynadrill-data-table
    [columns]="approvedColumns"
    [rows]="approvedRows()"
    [loading]="loading()"
    [rowKey]="rowKeyFn"
    [pageSize]="10"
    actionsHeader="Acciones"
    [actionsTemplate]="actionsTpl"
  />
}
