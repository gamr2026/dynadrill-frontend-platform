<app-page-header
  eyebrow="QHSE"
  title="Aspectos e Impactos Ambientales"
  subtitle="Actividad → aspecto/impacto → valoración de riesgo → control → seguimiento"
>
  <div actions><dynadrill-button (clicked)="nuevoAspecto()">+ Nuevo aspecto ambiental</dynadrill-button></div>
</app-page-header>

<div class="kpi-stat-row" role="list">
  @for (kpi of kpis(); track kpi.label) {
    <app-kpi-stat [value]="kpi.value" [label]="kpi.label" [tone]="kpi.tone" />
  }
</div>

@if (isMobile()) {
  <app-qhse-registros-movil [items]="itemsMovil()" [loading]="loading()" vacio="Todavía no hay aspectos ambientales registrados." />
} @else {
  <ng-template #actionsTpl let-row>
    <dynadrill-icon-button icon="eye" tooltip="Ver detalle" tooltipPlacement="top" (clicked)="verDetalle(row)" />
  </ng-template>

  <div class="table-scroll dyn-table-card">
    <dynadrill-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [rowKey]="rowKeyFn"
      [pageSize]="10"
      actionsHeader="Acciones"
      [actionsTemplate]="actionsTpl"
    />
  </div>
}
