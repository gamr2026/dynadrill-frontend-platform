<app-page-header
  eyebrow="QHSE"
  title="Checklist de equipos"
  subtitle="Un caso por unidad asignada — bloquea traslado_salida hasta que todos estén aprobados (D5)"
/>

<app-qhse-filtros [opciones]="opcionesFiltro()" [selected]="filtro()" (selectedChange)="filtro.set($any($event))" />

<div class="checklist-equipos-page__abrir">
  <dynadrill-input label="Abrir checklist del ticket #" type="number" placeholder="ID del ticket" [value]="ticketIdAbrir() ?? ''" (valueChange)="ticketIdAbrir.set($any($event))" />
  <dynadrill-button variant="secondary" [disabled]="!ticketIdAbrir()" (clicked)="abrirParaTicket()">Abrir</dynadrill-button>
</div>

@if (isMobile()) {
  <app-qhse-registros-movil [items]="itemsMovil()" [loading]="loading()" vacio="No hay checklists con ese filtro." />
} @else {
  <ng-template #actionsTpl let-row>
    <div class="checklist-equipos-page__row-actions">
      @if (row.caso.documentoNombreOriginal) {
        <dynadrill-icon-button icon="download" tooltip="Descargar documento" tooltipPlacement="top" (clicked)="descargar(row.caso.id)" />
      }
      @if (row.caso.estado === 'cargado') {
        <dynadrill-icon-button icon="check" tooltip="Aprobar" tooltipPlacement="top" [disabled]="submittingId() === row.caso.id" (clicked)="aprobar(row.caso)" />
        <dynadrill-icon-button icon="close" tooltip="Rechazar" tooltipPlacement="top" [disabled]="submittingId() === row.caso.id" (clicked)="rechazar(row.caso)" />
      }
      @if (row.caso.estado === 'rechazado' && row.caso.motivoRechazo) {
        <dynadrill-text variant="caption">Motivo: {{ row.caso.motivoRechazo }}</dynadrill-text>
      }
    </div>
  </ng-template>

  <div class="table-scroll dyn-table-card">
    <dynadrill-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [rowKey]="rowKeyFn"
      [pageSize]="10"
      actionsHeader="Acciones"
      [actionsTemplate]="actionsTpl"
    />
  </div>
}
