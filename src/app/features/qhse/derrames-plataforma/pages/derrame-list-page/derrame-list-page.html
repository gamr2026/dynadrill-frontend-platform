<div class="derrame-page">
  <app-page-header
    eyebrow="QHSE"
    title="Derrames"
    subtitle="HSE-AMBIENTAL-002 — contención en 5 minutos, notificación al MAE y desecho del suelo contaminado"
  >
    <div actions class="derrame-page__acciones">
      @if (puedeConfigurar()) {
        <dynadrill-button variant="secondary" (clicked)="configurarBandas()"
          >Configurar bandas</dynadrill-button
        >
      }
      <dynadrill-button variant="error" (clicked)="reportar()"
        >⚠ Derrame detectado</dynadrill-button
      >
    </div>
  </app-page-header>

  <div class="kpi-stat-row" role="list">
    @for (kpi of kpis(); track kpi.label) {
      <app-kpi-stat
        [value]="kpi.value"
        [label]="kpi.label"
        [tone]="kpi.tone"
        [caption]="kpi.caption"
      />
    }
  </div>

  <div class="derrame-page__toolbar">
    <app-qhse-filtros
      [opciones]="opcionesFiltro()"
      [selected]="filtroEstado()"
      (selectedChange)="filtroEstado.set($any($event))"
    />
    <dynadrill-input
      placeholder="Buscar por derrame, descripción, pedido…"
      [value]="busqueda()"
      (valueChange)="busqueda.set($event)"
    />
  </div>

  @if (isMobile()) {
    <app-qhse-registros-movil
      [items]="itemsMovil()"
      [loading]="cargando()"
      vacio="No hay derrames con ese filtro."
    />
  } @else {
    <ng-template #accionesTpl let-row>
      <div class="derrame-page__row-actions">
        <dynadrill-icon-button
          icon="eye"
          tooltip="Abrir"
          tooltipPlacement="top"
          (clicked)="abrir(row.id)"
        />
      </div>
    </ng-template>

    <div class="table-scroll dyn-table-card">
      <dynadrill-data-table
        [columns]="columnas"
        [rows]="filas()"
        [loading]="cargando()"
        [rowKey]="rowKeyFn"
        [pageSize]="10"
        actionsHeader="Acciones"
        [actionsTemplate]="accionesTpl"
      />
    </div>
  }
</div>
