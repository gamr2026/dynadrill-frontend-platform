<app-page-header
  eyebrow="QHSE"
  title="Gestión de Desechos"
  subtitle="HSE-AMBIENTAL-001 — bitácora, manifiestos y disposición final"
>
  <div actions>
    <dynadrill-button (clicked)="nuevoDesecho()">+ Registrar desecho</dynadrill-button>
  </div>
</app-page-header>

<div class="kpi-stat-row" role="list">
  @for (kpi of kpis(); track kpi.label) {
    <app-kpi-stat [value]="kpi.value" [label]="kpi.label" [tone]="kpi.tone" />
  }
</div>

<div class="desecho-list-page__toolbar">
  <app-qhse-filtros
    [opciones]="opcionesFiltro()"
    [selected]="filtro()"
    (selectedChange)="elegir($event)"
  />
  <dynadrill-input
    placeholder="Buscar por código, descripción o ubicación…"
    [value]="busqueda()"
    (valueChange)="busqueda.set($event)"
  />
</div>

@if (isMobile()) {
  <app-qhse-registros-movil
    [items]="itemsMovil()"
    [loading]="loading()"
    vacio="No hay desechos con ese filtro."
  />
} @else {
  <ng-template #actionsTpl let-row>
    <dynadrill-icon-button
      icon="eye"
      tooltip="Ver detalle"
      tooltipPlacement="top"
      (clicked)="abrir(row)"
    />
  </ng-template>

  <div class="table-scroll dyn-table-card">
    <dynadrill-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [rowKey]="rowKeyFn"
      [pageSize]="10"
      actionsHeader="Acciones"
      [actionsTemplate]="actionsTpl"
    />
  </div>
}
