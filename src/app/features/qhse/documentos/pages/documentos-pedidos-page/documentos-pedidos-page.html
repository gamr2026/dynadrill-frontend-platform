<dynadrill-screen-header
  eyebrow="QHSE"
  title="Documentos por pedido"
  subtitle="Formato de Recepción y SFI (QHSE) — ART y PT los sube el Supervisor desde su ticket de Pumping"
  roleTag="HSE"
/>

<ng-template #actionsTpl let-row>
  <div class="documentos-pedidos-page__row-actions">
    @if (row.estado.formatoRecepcion) {
      <dynadrill-icon-button icon="download" tooltip="Descargar Formato de Recepción" tooltipPlacement="top" (clicked)="descargar(row.pedidoId, 'qhse_formato_recepcion')" />
    } @else {
      <dynadrill-icon-button icon="upload" tooltip="Subir Formato de Recepción" tooltipPlacement="top" [disabled]="subiendoTipo(row.pedidoId, 'qhse_formato_recepcion')" (clicked)="formatoInput.click()" />
    }
    <input #formatoInput type="file" hidden (change)="subir(row.pedidoId, 'qhse_formato_recepcion', formatoInput)" />

    @if (row.estado.sfi) {
      <dynadrill-icon-button icon="download" tooltip="Descargar SFI" tooltipPlacement="top" (clicked)="descargar(row.pedidoId, 'qhse_sfi')" />
    } @else {
      <dynadrill-icon-button icon="upload" tooltip="Subir SFI" tooltipPlacement="top" [disabled]="subiendoTipo(row.pedidoId, 'qhse_sfi')" (clicked)="sfiInput.click()" />
    }
    <input #sfiInput type="file" hidden (change)="subir(row.pedidoId, 'qhse_sfi', sfiInput)" />
  </div>
</ng-template>

<div class="table-scroll">
  <dynadrill-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [rowKey]="rowKeyFn"
    [pageSize]="10"
    actionsHeader="Acciones"
    [actionsTemplate]="actionsTpl"
  />
</div>
