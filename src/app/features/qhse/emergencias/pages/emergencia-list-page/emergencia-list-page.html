<dynadrill-screen-header
  eyebrow="QHSE"
  title="Emergencias y MEDEVAC"
  subtitle="HSE-TRIAGE-001 — plan de respuesta a emergencias"
  roleTag="HSE"
/>

<dynadrill-kpi-row [items]="kpis()" />

<div class="emergencia-list-page__grid">
  @for (e of cards(); track e.id) {
    <dynadrill-card [accent]="e.accent">
      <span card-title>{{ e.code }}</span>
      <div card-extra class="emergencia-list-page__extra">
        <dynadrill-tag [label]="e.nivelLabel" variant="neutral" />
        <dynadrill-tag [label]="e.estadoLabel" [variant]="e.accent" />
      </div>

      <p class="emergencia-list-page__tipo">{{ e.tipo }}</p>
      <dl class="emergencia-list-page__meta">
        <div><dt>Ubicación</dt><dd>{{ e.ubicacion }}</dd></div>
        <div><dt>Fecha/hora</dt><dd>{{ e.activadoAt }}</dd></div>
      </dl>

      @if (e.flashSegundosRestantes !== null) {
        <div class="emergencia-list-page__flash">
          <span>Reporte Flash vence en</span>
          <dynadrill-timer [seconds]="e.flashSegundosRestantes" [critical]="e.flashSegundosRestantes < 900" />
        </div>
      } @else if (e.flashLabel) {
        <dynadrill-tag [label]="e.flashLabel" [variant]="e.flashLabel.includes('vencido') ? 'error' : 'success'" />
      }

      <dynadrill-button variant="secondary" size="small" (clicked)="viewDetail(e.id)">Ver detalle</dynadrill-button>
    </dynadrill-card>
  } @empty {
    <dynadrill-banner variant="info" message="Todavía no hay emergencias registradas. Se activan desde el botón 'Reportar' del encabezado." />
  }
</div>
