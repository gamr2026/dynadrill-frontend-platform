<div class="iperc-list">
  <app-page-header
    eyebrow="QHSE"
    title="Matriz IPERC"
    subtitle="DYN-SGI-RE-087 (GTC 45) — matriz maestra por actividad, aprobada cada año; el PTW exige las de su tipo de servicio"
  >
    <div actions>
      @if (puedeGestionar()) {
        <dynadrill-button (clicked)="nueva()">+ Nueva actividad</dynadrill-button>
      }
    </div>
  </app-page-header>

  <dynadrill-tabs
    [tabs]="tabs"
    [activeIndex]="tabActiva()"
    (activeIndexChange)="tabActiva.set($event)"
  />

  @if (tabActiva() === 1) {
    <app-iperc-cobertura-panel [actividades]="actividades()" [puedeEditar]="puedeGestionar()" />
  } @else {
    <div class="kpi-stat-row" role="list">
      @for (kpi of kpis(); track kpi.label) {
        <app-kpi-stat [value]="kpi.value" [label]="kpi.label" [tone]="kpi.tone" />
      }
    </div>

    <div class="iperc-list__toolbar">
      <dynadrill-input
        placeholder="Buscar por actividad, proceso o zona…"
        [value]="busqueda()"
        (valueChange)="busqueda.set($event)"
      />
    </div>

    @if (isMobile()) {
      <app-qhse-registros-movil
        [items]="itemsMovil()"
        [loading]="cargando()"
        vacio="No hay actividades con ese filtro."
      />
    } @else {
      <ng-template #accionesTpl let-row>
        <div class="iperc-list__row-actions">
          <dynadrill-icon-button
            icon="eye"
            tooltip="Abrir la matriz"
            tooltipPlacement="top"
            (clicked)="abrir(row.id)"
          />
          @if (puedeNuevaVersion(row.id)) {
            <dynadrill-icon-button
              icon="copy"
              tooltip="Crear la versión nueva (revisión anual)"
              tooltipPlacement="top"
              (clicked)="nuevaVersion(row.id)"
            />
          }
        </div>
      </ng-template>

      <div class="table-scroll dyn-table-card">
        <dynadrill-data-table
          [columns]="columnas"
          [rows]="filas()"
          [loading]="cargando()"
          [rowKey]="rowKeyFn"
          [pageSize]="10"
          actionsHeader="Acciones"
          [actionsTemplate]="accionesTpl"
        />
      </div>
    }
  }
</div>
