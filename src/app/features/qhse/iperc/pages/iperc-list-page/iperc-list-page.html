<app-page-header
  eyebrow="QHSE"
  title="Matriz Maestra IPERC"
  subtitle="DYN-SGI-RE-087 — un solo documento anual; cada fila es una actividad con su propio estado de evaluación"
>
  <div actions class="iperc-list-page__toolbar">
    <dynadrill-button variant="secondary" (clicked)="verMatrizConsolidada()">Ver matriz consolidada</dynadrill-button>
    <dynadrill-button (clicked)="nuevaMatriz()">+ Agregar actividad</dynadrill-button>
  </div>
</app-page-header>

<div class="kpi-stat-row" role="list">
  @for (kpi of kpis(); track kpi.label) {
    <app-kpi-stat [value]="kpi.value" [label]="kpi.label" [tone]="kpi.tone" />
  }
</div>

<ng-template #actionsTpl let-row>
  <div class="iperc-list-page__row-actions">
    <dynadrill-icon-button icon="eye" tooltip="Ver detalle" tooltipPlacement="top" (clicked)="viewDetail(row)" />
    <dynadrill-icon-button icon="edit" tooltip="Editar matriz" tooltipPlacement="top" (clicked)="editarMatriz(row)" />
    <dynadrill-icon-button icon="insert-row-below" tooltip="Ver matriz" tooltipPlacement="top" (clicked)="imprimirMatriz(row)" />
  </div>
</ng-template>

<div class="table-scroll dyn-table-card">
  <dynadrill-data-table
    [columns]="columns()"
    [rows]="rows()"
    [loading]="loading()"
    [rowKey]="rowKeyFn"
    [pageSize]="10"
    actionsHeader="Acciones"
    [actionsTemplate]="actionsTpl"
  />
</div>
