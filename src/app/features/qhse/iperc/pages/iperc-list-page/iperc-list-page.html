<dynadrill-screen-header
  eyebrow="QHSE"
  title="Matrices IPERC"
  subtitle="Identificación de Peligros, Evaluación de Riesgos y Controles"
  roleTag="HSE"
/>

<dynadrill-kpi-row [items]="kpis()" />

<ng-template #actionsTpl let-row>
  <dynadrill-button variant="secondary" size="small" (click)="viewDetail(row)">
    Ver detalle
  </dynadrill-button>
</ng-template>

<ng-template #faseTpl let-row>
  <dynadrill-phase-track [steps]="faseSteps" [currentIndex]="row.faseIndex" [blocked]="row.faseBlocked" [blockedReason]="row.faseBlockedReason" />
</ng-template>

<dynadrill-data-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="loading()"
  [rowKey]="rowKeyFn"
  [pageSize]="10"
  actionsHeader="Acciones"
  [actionsTemplate]="actionsTpl"
  [columnTemplates]="{ statusBadge: faseTpl }"
/>
