<app-page-header
  eyebrow="QHSE"
  title="Objetivos Ambientales"
  subtitle="Objetivo → meta → indicador → plazo → plan de acción (revisión anual del SGA)"
>
  @if (puedeGestionar()) {
    <div actions>
      <dynadrill-button (clicked)="nuevoObjetivo()">+ Nuevo objetivo</dynadrill-button>
    </div>
  }
</app-page-header>

<div class="kpi-stat-row" role="list">
  @for (kpi of kpis(); track kpi.label) {
    <app-kpi-stat [value]="kpi.value" [label]="kpi.label" [tone]="kpi.tone" />
  }
</div>

@if (isMobile()) {
  <app-qhse-registros-movil
    [items]="itemsMovil()"
    [loading]="loading()"
    vacio="Todavía no hay objetivos ambientales."
  />
} @else {
  <ng-template #actionsTpl let-row>
    <dynadrill-icon-button
      icon="eye"
      tooltip="Ver detalle"
      tooltipPlacement="top"
      (clicked)="verDetalle(row)"
    />
  </ng-template>

  <div class="table-scroll dyn-table-card">
    <dynadrill-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [rowKey]="rowKeyFn"
      [pageSize]="10"
      actionsHeader="Acciones"
      [actionsTemplate]="actionsTpl"
    />
  </div>
}
