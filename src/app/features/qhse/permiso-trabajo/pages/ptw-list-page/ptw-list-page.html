<div class="ptw-page">
  <app-page-header
    eyebrow="QHSE"
    title="Permisos de trabajo (PTW)"
    subtitle="HSE-SITIO-001 — uno por pedido y día de operación: gabinete, formalización y aprobación"
  >
    <div actions>
      @if (puedeGestionar()) {
        <dynadrill-button (clicked)="nuevo()">+ Abrir PTW</dynadrill-button>
      }
    </div>
  </app-page-header>

  <div class="ptw-page__toolbar">
    <app-qhse-filtros
      [opciones]="opcionesFiltro()"
      [selected]="filtroFase()"
      (selectedChange)="filtroFase.set($any($event))"
    />
    <dynadrill-input
      placeholder="Buscar por PTW, pedido, cliente, ticket…"
      [value]="busqueda()"
      (valueChange)="busqueda.set($event)"
    />
  </div>

  @if (isMobile()) {
    <app-qhse-registros-movil
      [items]="itemsMovil()"
      [loading]="cargando()"
      vacio="No hay permisos de trabajo con ese filtro."
    />
  } @else {
    <ng-template #accionesTpl let-row>
      <div class="ptw-page__row-actions">
        <dynadrill-icon-button
          icon="eye"
          tooltip="Abrir"
          tooltipPlacement="top"
          (clicked)="abrir(row.id)"
        />
      </div>
    </ng-template>

    <div class="table-scroll dyn-table-card">
      <dynadrill-data-table
        [columns]="columnas"
        [rows]="filas()"
        [loading]="cargando()"
        [rowKey]="rowKeyFn"
        [pageSize]="10"
        actionsHeader="Acciones"
        [actionsTemplate]="accionesTpl"
      />
    </div>
  }
</div>
