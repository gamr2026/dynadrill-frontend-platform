<div class="reportar-dialog">
  <dynadrill-text variant="body">Disponible para cualquier persona, sin importar tu rol. Elige qué quieres reportar:</dynadrill-text>

  <button type="button" class="reportar-dialog__option reportar-dialog__option--stop" (click)="reportarStop()">
    <dynadrill-icon name="warning" [size]="20" />
    <div>
      <strong>Tarjeta STOP</strong>
      <span>Acto o condición insegura observada</span>
    </div>
  </button>

  <button type="button" class="reportar-dialog__option reportar-dialog__option--swa" (click)="reportarSwa()">
    <dynadrill-icon name="alert" [size]="20" />
    <div>
      <strong>Detener el trabajo (SWA)</strong>
      <span>Peligro inminente — para la actividad ahora</span>
    </div>
  </button>

  <button type="button" class="reportar-dialog__option" (click)="reportarDesecho()">
    <dynadrill-icon name="modules" [size]="20" />
    <div>
      <strong>Registrar desecho</strong>
      <span>Clasificación en campo — peligroso o no peligroso</span>
    </div>
  </button>

  <button type="button" class="reportar-dialog__option reportar-dialog__option--swa" (click)="reportarDerrame()">
    <dynadrill-icon name="warning" [size]="20" />
    <div>
      <strong>Derrame detectado</strong>
      <span>Alerta y protocolo de contención</span>
    </div>
  </button>
</div>
