<dynadrill-screen-header
  eyebrow="QHSE"
  title="Stop Work Authority"
  subtitle="HSE-SEGUIMIENTO-003 — eventos de parada de trabajo"
  roleTag="HSE"
/>

<dynadrill-kpi-row [items]="kpis()" />

<div class="swa-list-page__grid">
  @for (c of cards(); track c.id) {
    <dynadrill-card [accent]="c.accent">
      <span card-title>{{ c.code }}</span>
      <div card-extra class="swa-list-page__extra">
        @if (c.heroeSeguridad) {
          <dynadrill-tag label="Héroe de Seguridad" variant="brand" />
        }
        <dynadrill-tag [label]="c.estadoLabel" [variant]="c.accent" />
      </div>

      <p class="swa-list-page__peligro">{{ c.tipoPeligro }}</p>
      <dl class="swa-list-page__meta">
        <div><dt>Ubicación</dt><dd>{{ c.ubicacion }}</dd></div>
        <div><dt>Activado por</dt><dd>{{ c.activadoPorNombre }}</dd></div>
        <div><dt>Fecha/hora</dt><dd>{{ c.activadoAt }}</dd></div>
      </dl>

      <dynadrill-button variant="secondary" size="small" (clicked)="viewDetail(c.id)">Ver detalle</dynadrill-button>
    </dynadrill-card>
  } @empty {
    <dynadrill-banner variant="info" message="Todavía no hay eventos SWA registrados. Se crean desde el botón 'Reportar' del encabezado." />
  }
</div>
