<div class="user-list-page">
  <div class="user-list-page__header">
    <dynadrill-text variant="h1">Usuarios</dynadrill-text>
    <div class="user-list-page__actions">
      <dynadrill-button (clicked)="createUser()">
        <dynadrill-icon name="add" [size]="14" />
        Nuevo usuario
      </dynadrill-button>
    </div>
  </div>

  <dynadrill-spinner mode="overlay" [spinning]="loading()" tip="Cargando usuarios…">
    <dynadrill-data-table
      [columns]="columns"
      [rows]="rows()"
      [rowKey]="rowKeyFn"
      [pageSize]="10"
      [actionsTemplate]="actions"
    />
  </dynadrill-spinner>

  <ng-template #actions let-row>
    <dynadrill-icon-button icon="edit" iconSource="dynadrill" tooltip="Editar usuario" tooltipPlacement="top" (clicked)="editRow(row)" />
    <dynadrill-icon-button icon="delete" iconSource="dynadrill" tooltip="Eliminar usuario" tooltipPlacement="top" class="btn-danger" (clicked)="deleteRow(row)" />
  </ng-template>
</div>
