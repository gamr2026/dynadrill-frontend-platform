<div class="user-list-page">
  <div class="user-list-page__header">
    <dynadrill-text variant="h1">Usuarios</dynadrill-text>
    <div class="user-list-page__actions">
      <dynadrill-button (clicked)="createUser()">
        <dynadrill-icon name="add" [size]="14" />
        Nuevo usuario
      </dynadrill-button>
    </div>
  </div>

  <dynadrill-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [rowKey]="rowKeyFn"
    [actionsTemplate]="actions"
  />

  <ng-template #actions let-row>
    <button type="button" class="dynadrill-data-table__action-btn" title="Editar usuario" (click)="editRow(row)">
      <dynadrill-icon name="edit" [size]="14" />
    </button>
    <button
      type="button"
      class="dynadrill-data-table__action-btn dynadrill-data-table__action-btn--danger"
      title="Eliminar usuario"
      (click)="deleteRow(row)"
    >
      <dynadrill-icon name="delete" [size]="14" />
    </button>
  </ng-template>
</div>
