<div class="user-list-page">
  <div class="user-list-page__header">
    <dynadrill-text variant="h1">Usuarios</dynadrill-text>
    <div class="user-list-page__actions">
      <dynadrill-button variant="secondary" [disabled]="!canEdit()" (clicked)="editSelected()">
        <dynadrill-icon name="edit" [size]="14" />
        Editar
      </dynadrill-button>
      <dynadrill-button variant="error" [disabled]="!canDelete()" (clicked)="deleteSelected()">
        <dynadrill-icon name="delete" [size]="14" />
        Eliminar
      </dynadrill-button>
      <dynadrill-button (clicked)="createUser()">
        <dynadrill-icon name="add" [size]="14" />
        Nuevo usuario
      </dynadrill-button>
    </div>
  </div>

  <dynadrill-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [selectable]="true"
    [selectedRows]="selectedRows()"
    [rowKey]="rowKeyFn"
    (selectedRowsChange)="onSelectedRowsChange($event)"
  />
</div>
