<nav class="bottom-nav" aria-label="Navegación principal">
  @if (moduleItems(); as items) {
    @for (item of items; track item.link) {
      <a
        class="bottom-nav__item"
        [routerLink]="item.link"
        routerLinkActive="bottom-nav__item--active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
      >
        <span class="bottom-nav__indicator">
          @if (item.icon) {
            <dynadrill-icon [name]="item.icon" [size]="22" />
          } @else {
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              @for (d of item.svg; track d) {
                <path [attr.d]="d" />
              }
            </svg>
          }
        </span>
        <span class="bottom-nav__label">{{ item.label }}</span>
      </a>
    }
  } @else {
    <a
      class="bottom-nav__item"
      routerLink="/dashboard"
      routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      #home="routerLinkActive"
      [attr.aria-current]="home.isActive ? 'page' : null"
    >
      <span class="bottom-nav__indicator"><dynadrill-icon name="home" [size]="22" /></span>
      <span class="bottom-nav__label">Inicio</span>
    </a>

    <button
      type="button"
      class="bottom-nav__item"
      [class.bottom-nav__item--active]="sidebarState.open()"
      [attr.aria-expanded]="sidebarState.open()"
      (click)="sidebarState.toggle()"
    >
      <span class="bottom-nav__indicator"><dynadrill-icon name="modules" [size]="22" /></span>
      <span class="bottom-nav__label">Módulos</span>
    </button>

    <button type="button" class="bottom-nav__item" (click)="openReportar()">
      <span class="bottom-nav__indicator"><dynadrill-icon name="alert" [size]="22" /></span>
      <span class="bottom-nav__label">Reportar</span>
    </button>
  }
</nav>
