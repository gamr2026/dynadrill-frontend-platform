<header class="app-header" [class.app-header--detail]="detail()">
  @if (detail(); as d) {
    <a class="app-header__back" [routerLink]="d.backLink" aria-label="Volver">
      <dynadrill-icon name="arrow-left" [size]="24" />
    </a>
    <span class="app-header__detail-title">{{ d.title }}</span>
  }
  <button
    type="button"
    class="app-header__menu-toggle"
    aria-label="Abrir menú de módulos"
    aria-controls="mobile-drawer"
    [attr.aria-expanded]="sidebarState.open()"
    (click)="sidebarState.toggle()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
  <img class="app-header__logo" src="/brand/dynadrill-logo.svg" alt="Dynadrill" />
  <div class="app-header__spacer"></div>
  <dynadrill-button class="app-header__reportar-btn" variant="error" size="small" (clicked)="actions.openReportar()">
    <dynadrill-icon name="alert" [size]="14" />
    Reportar
  </dynadrill-button>
  <dynadrill-notification-bell class="app-header__bell" [items]="notificationItems()" (itemClick)="onNotificationClick($event)" />
  <dynadrill-button class="app-header__logout-btn" variant="secondary" size="small" [disabled]="actions.loggingOut()" (clicked)="actions.logout()">
    <span class="app-header__logout">
      @if (actions.loggingOut()) {
        <dynadrill-spinner size="sm" />
      } @else {
        <dynadrill-icon name="logout" [size]="14" />
      }
      {{ actions.loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
    </span>
  </dynadrill-button>
</header>
