<nav class="app-sidebar">
  <button type="button" class="app-sidebar__close" aria-label="Cerrar menú" (click)="sidebarState.close()">
    <dynadrill-icon name="close" [size]="16" />
  </button>

  @if (user(); as u) {
    <div class="app-sidebar__profile">
      <dynadrill-avatar [name]="u.name" size="md" />
      <div class="app-sidebar__profile-text">
        <span class="app-sidebar__profile-name">{{ u.name }}</span>
        <span class="app-sidebar__profile-role">{{ u.roleName }}</span>
      </div>
    </div>
  }

  <dynadrill-menu [items]="items()" />

  <dynadrill-button class="app-sidebar__reportar" variant="error" size="small" (clicked)="openReportar()">
    <dynadrill-icon name="alert" [size]="14" />
    Reportar
  </dynadrill-button>

  <dynadrill-button class="app-sidebar__logout" variant="primary" size="small" [disabled]="loggingOut()" (clicked)="logout()">
    <span class="app-sidebar__logout-content">
      @if (loggingOut()) {
        <dynadrill-spinner size="sm" />
      } @else {
        <dynadrill-icon name="logout" [size]="14" />
      }
      {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
    </span>
  </dynadrill-button>
</nav>
