<nav class="app-sidebar">
  <button type="button" class="app-sidebar__close" aria-label="Cerrar menú" (click)="sidebarState.close()">
    <dynadrill-icon name="close" [size]="16" />
  </button>

  <dynadrill-menu [items]="items()" />

  <dynadrill-button class="app-sidebar__logout" variant="primary" size="small" (clicked)="logout()">
    <span class="app-sidebar__logout-content">
      <dynadrill-icon name="logout" [size]="14" />
      Cerrar sesión
    </span>
  </dynadrill-button>
</nav>
